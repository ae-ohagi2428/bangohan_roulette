{% extends 'base.html' %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-screen">
  <h1 class="text-3xl md:text-5xl font-bold mb-2" style="font-family: 'Noto Serif JP', serif;">
  🍽️🍽️ばんごはんルーレット🍽️🍽️
</h1>
  <p class="text-xl mb-10" style="color: #8b7355;">～今夜の献立を決めよう～</p>

  <div class="card w-96 shadow-xl" style="background-color: #fffdf7; border: 1px solid #e0d5c0;">
    <div class="card-body items-center text-center">
      <p id="dish-name" class="text-5xl font-bold my-8" style="color: #5c4a2a; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;">
        🍽
      </p>
      <button id="start-btn" class="btn btn-lg text-white border-none"
        style="background-color: #8b7355;"
        onmouseover="this.style.backgroundColor='#7a6445'"
        onmouseout="this.style.backgroundColor='#8b7355'"
        onclick="startRoulette()">
        スタート
      </button>
    </div>
  </div>
</div>

<script>
function startRoulette() {
  const dishName = document.getElementById('dish-name');
  const btn = document.getElementById('start-btn');
  btn.disabled = true;
  btn.classList.add('btn-disabled');

  const emojis = ['🍜', '🍛', '🍝', '🍣', '🍤', '🥘', '🍖', '🥗'];
  let count = 0;

  const interval = setInterval(() => {
    dishName.textContent = emojis[count % emojis.length];
    count++;
  }, 500);

  setTimeout(() => {
    clearInterval(interval);
    fetch("{% url 'bangohan_roulette:random_dish' %}")
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          alert(data.error);
          btn.disabled = false;
          btn.classList.remove('btn-disabled');
          return;
        }
        window.location.href = `/result/${data.dish_id}/`;
      });
  }, 3000);
}
</script>
{% endblock %}
